<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaliza tu Kokedama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde-bosque: #2b4436;
            --verde-suave: #4a6b57;
            --texto: #222b25;
            --blanco-cristal: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #1a2920;
            background-image: linear-gradient(rgba(20, 35, 25, 0.8), rgba(20, 35, 25, 0.9)), 
                              url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--texto);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 25px 20px 10px 20px;
            text-align: center;
            color: #ffffff;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            opacity: 0.85;
            margin-top: 5px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 10px auto 30px auto;
        }

        .card-aesthetic {
            background: var(--blanco-cristal);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            position: relative;
        }

        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: none;
            color: var(--verde-bosque);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-volver:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .hero-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .card-aesthetic h2 {
            font-family: 'Playfair Display', serif;
            color: var(--verde-bosque);
            font-size: 1.5rem;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .btn-empezar {
            background-color: var(--verde-bosque);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(43, 68, 54, 0.3);
        }

        #configurador {
            display: none;
        }

        /* Contenedor Visual */
        .preview-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 15px;
            margin-top: 25px;
            margin-bottom: 20px;
            border: 1px solid #eaeaea;
            height: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-img {
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 100%;
        }

        /* Escalas ajustadas con Transform para no alejar la imagen */
        .size-chica {
            height: 180px;
            transform: scale(0.85);
        }

        .size-mediana {
            height: 220px;
            transform: scale(1);
        }

        .size-grande {
            height: 280px;
            transform: scale(1.15);
        }

        .preview-badge {
            display: inline-block;
            background: #eaf1ed;
            color: var(--verde-bosque);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .paso-titulo {
            font-family: 'Playfair Display', serif;
            color: var(--verde-bosque);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: left;
        }

        .opciones-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-opcion {
            background: #ffffff;
            border: 1.5px solid #e0e6e2;
            color: var(--texto);
            padding: 14px 8px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-opcion:hover {
            border-color: var(--verde-suave);
        }

        .btn-opcion.activo {
            background-color: var(--verde-bosque);
            color: white;
            border-color: var(--verde-bosque);
            box-shadow: 0 4px 12px rgba(43, 68, 54, 0.25);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>KOKEDAMAS</h1>
        <p>Arte botánico artesanal</p>
    </header>

    <div class="container">

        <!-- Pantalla Inicial -->
        <div id="pantalla-bienvenida" class="card-aesthetic">
            <img src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?q=80&w=800&auto=format&fit=crop" alt="Kokedama artesanal" class="hero-img">
            <h2>Diseña tu Kokedama</h2>
            <p>Elige el tamaño de tu base de musgo y arma tu pieza paso a paso.</p>
            <button class="btn-empezar" onclick="empezar()">Empecemos</button>
        </div>

        <!-- Configurador -->
        <div id="configurador" class="card-aesthetic">
            
            <button class="btn-volver" onclick="volverAtras()">← Volver</button>

            <!-- Previsualización Dinámica -->
            <div class="preview-card">
                <img id="preview-img" src="bola-chica.jpg" class="preview-img size-chica" alt="Base Kokedama">
                <div>
                    <span id="preview-base" class="preview-badge">Base: Chica</span>
                    <span id="preview-planta" class="preview-badge" style="display:none;">Planta: Pendiente</span>
                </div>
            </div>

            <!-- Paso 1: Base -->
            <div id="paso-1">
                <div class="paso-titulo">1. Elige el tamaño de la base</div>
                <div class="opciones-grid">
                    <button class="btn-opcion activo" onclick="seleccionarBase('Chica', 'bola-chica.jpg', 'size-chica', this)">Chica</button>
                    <button class="btn-opcion" onclick="seleccionarBase('Mediana', 'bola-mediana.jpg', 'size-mediana', this)">Mediana</button>
                    <button class="btn-opcion" onclick="seleccionarBase('Grande', 'bola-grande.jpg', 'size-grande', this)">Grande</button>
                </div>
            </div>

            <!-- Paso 2: Planta -->
            <div id="paso-2" style="display: none;">
                <div class="paso-titulo">2. Elige tu planta</div>
                <div class="opciones-grid">
                    <button class="btn-opcion" onclick="seleccionarPlanta('Helecho', this)">Helecho</button>
                    <button class="btn-opcion" onclick="seleccionarPlanta('Spatiphyllum', this)">Spatiphyllum</button>
                    <button class="btn-opcion" onclick="seleccionarPlanta('Ficus', this)">Ficus</button>
                </div>
            </div>

            <button id="btn-ws" class="btn-whatsapp" onclick="enviarWhatsApp()">
                💬 Pedir por WhatsApp
            </button>
        </div>

    </div>

    <script>
        let eleccionBase = "Chica";
        let eleccionPlanta = "";
        let pasoActual = 0;
        const numeroTelefono = "1234567890"; // Reemplaza con tu número de WhatsApp

        function empezar() {
            pasoActual = 1;
            document.getElementById('pantalla-bienvenida').style.display = 'none';
            document.getElementById('configurador').style.display = 'block';
        }

        function volverAtras() {
            if (pasoActual === 2) {
                pasoActual = 1;
                document.getElementById('paso-2').style.display = 'none';
                document.getElementById('btn-ws').style.display = 'none';
            } else {
                pasoActual = 0;
                document.getElementById('configurador').style.display = 'none';
                document.getElementById('pantalla-bienvenida').style.display = 'block';
            }
        }

        function seleccionarBase(tamano, nombreImagen, claseTamano, elemento) {
            eleccionBase = tamano;
            pasoActual = 2;
            
            document.getElementById('preview-base').innerText = 'Base: ' + tamano;
            const imgElement = document.getElementById('preview-img');
            
            imgElement.src = nombreImagen;
            imgElement.className = 'preview-img ' + claseTamano;
            
            let botones = document.querySelectorAll('#paso-1 .btn-opcion');
            botones.forEach(b => b.classList.remove('activo'));
            elemento.classList.add('activo');

            document.getElementById('paso-2').style.display = 'block';
            document.getElementById('preview-planta').style.display = 'inline-block';
        }

        function seleccionarPlanta(planta, elemento) {
            eleccionPlanta = planta;
            
            document.getElementById('preview-planta').innerText = 'Planta: ' + planta;
            
            let botones = document.querySelectorAll('#paso-2 .btn-opcion');
            botones.forEach(b => b.classList.remove('activo'));
            elemento.classList.add('activo');

            document.getElementById('btn-ws').style.display = 'block';
        }

        function enviarWhatsApp() {
            const mensaje = `¡Hola! Estuve personalizando mi Kokedama en la página web:%0A%0A🌿 *Tamaño de Base:* ${eleccionBase}%0A🌱 *Planta:* ${eleccionPlanta}%0A%0AMe gustaría consultar sobre el precio y coordinar la compra.`;
            const url = `https://wa.me/${numeroTelefono}?text=${mensaje}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
