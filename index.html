<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaliza tu Kokedama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gris-principal: #2d3032;
            --gris-oscuro: #1c1e1f;
            --marrón-cálido: #8c6d58;
            --marrón-suave: #a88972;
            --luz-calida: #f4ece1;
            --texto-oscuro: #2b2b2b;
            --blanco-cristal: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--gris-oscuro);
            background-image: radial-gradient(circle at 50% 20%, rgba(244, 236, 225, 0.08) 0%, rgba(0, 0, 0, 0.8) 80%),
                              linear-gradient(rgba(28, 30, 31, 0.85), rgba(28, 30, 31, 0.95)),
                              url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--texto-oscuro);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 30px 20px 15px 20px;
            text-align: center;
            color: var(--luz-calida);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(244, 236, 225, 0.2);
        }

        header p {
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--marrón-suave);
            margin-top: 6px;
        }

        .container {
            width: 92%;
            max-width: 480px;
            margin: 10px auto 40px auto;
        }

        .card-aesthetic {
            background: var(--blanco-cristal);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 30px rgba(244, 236, 225, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            position: relative;
        }

        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(45, 48, 50, 0.08);
            border: none;
            color: var(--gris-principal);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-volver:hover {
            background: rgba(45, 48, 50, 0.15);
        }

        /* Foto de inicio */
        .hero-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .card-aesthetic h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gris-principal);
            font-size: 1.7rem;
            margin-top: 5px;
            margin-bottom: 12px;
        }

        .card-aesthetic p {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Botón Empecemos */
        .btn-empezar {
            background-color: var(--gris-principal);
            color: var(--luz-calida);
            border: 1px solid var(--marrón-cálido);
            padding: 18px 45px;
            font-size: 1.15rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(45, 48, 50, 0.35);
        }

        .btn-empezar:hover {
            background-color: var(--marrón-cálido);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(140, 109, 88, 0.4);
        }

        #configurador {
            display: none;
        }

        /* Indicador de pasos */
        .pasos-indicador {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--marrón-cálido);
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* Contenedor Visual uniforme */
        .preview-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 20px;
            border: 1px solid #e8e8e8;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 14px;
            transition: opacity 0.3s ease;
        }

        .preview-badge {
            display: inline-block;
            background: var(--luz-calida);
            color: var(--marrón-cálido);
            border: 1px solid rgba(140, 109, 88, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-top: 12px;
            margin-right: 4px;
        }

        .paso-titulo {
            font-family: 'Playfair Display', serif;
            color: var(--gris-principal);
            font-size: 1.25rem;
            margin-bottom: 15px;
            text-align: left;
        }

        .opciones-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-opcion {
            background: #ffffff;
            border: 1.5px solid #e2e2e2;
            color: var(--gris-principal);
            padding: 14px 8px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-opcion:hover {
            border-color: var(--marrón-suave);
            background: #fcfbfa;
        }

        .btn-opcion.activo {
            background-color: var(--gris-principal);
            color: var(--luz-calida);
            border-color: var(--marrón-cálido);
            box-shadow: 0 4px 14px rgba(45, 48, 50, 0.3);
        }

        /* Botón Siguiente */
        .btn-siguiente {
            background-color: var(--gris-principal);
            color: var(--luz-calida);
            border: 1px solid var(--marrón-cálido);
            padding: 16px;
            width: 100%;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(45, 48, 50, 0.25);
        }

        .btn-siguiente:hover {
            background-color: var(--marrón-cálido);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(140, 109, 88, 0.35);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
        }
    </style>
</head>
<body>

    <header>
        <h1>KOKEDAMAS</h1>
        <p>Arte botánico artesanal</p>
    </header>

    <div class="container">

        <!-- Pantalla Inicial -->
        <div id="pantalla-bienvenida" class="card-aesthetic">
            <img src="portada.jpg" alt="Kokedama artesanal" class="hero-img">
            <h2>Diseña tu Kokedama</h2>
            <p>Elige el tamaño de tu base de musgo y arma tu pieza paso a paso.</p>
            <button class="btn-empezar" onclick="empezar()">Empecemos</button>
        </div>

        <!-- Configurador -->
        <div id="configurador" class="card-aesthetic">
            
            <button class="btn-volver" onclick="volverAtras()">← Volver</button>

            <!-- Previsualización Dinámica -->
            <div class="preview-card">
                <img id="preview-img" src="bola-chica.jpg" class="preview-img" alt="Base Kokedama">
                <div>
                    <span id="preview-base" class="preview-badge">Base: Chica</span>
                    <span id="preview-planta" class="preview-badge" style="display:none;">Planta: Pendiente</span>
                </div>
            </div>

            <!-- Paso 1: Base -->
            <div id="paso-1">
                <div class="pasos-indicador">Paso 1 de 2</div>
                <div class="paso-titulo">Elige el tamaño de la base</div>
                <div class="opciones-grid">
                    <button class="btn-opcion activo" onclick="seleccionarBase('Chica', 'bola-chica.jpg', this)">Chica</button>
                    <button class="btn-opcion" onclick="seleccionarBase('Mediana', 'bola-mediana.jpg', this)">Mediana</button>
                    <button class="btn-opcion" onclick="seleccionarBase('Grande', 'bola-grande.jpg', this)">Grande</button>
                </div>
                <button class="btn-siguiente" onclick="irAlPaso2()">Siguiente →</button>
            </div>

            <!-- Paso 2: Planta -->
            <div id="paso-2" style="display: none;">
                <div class="pasos-indicador">Paso 2 de 2</div>
                <div class="paso-titulo">Elige tu planta</div>
                <div class="opciones-grid">
                    <button class="btn-opcion" onclick="seleccionarPlanta('Helecho', this)">Helecho</button>
                    <button class="btn-opcion" onclick="seleccionarPlanta('Spatiphyllum', this)">Spatiphyllum</button>
                    <button class="btn-opcion" onclick="seleccionarPlanta('Ficus', this)">Ficus</button>
                </div>
                <button id="btn-ws" class="btn-whatsapp" onclick="enviarWhatsApp()" style="display: none;">
                    💬 Pedir por WhatsApp
                </button>
            </div>

        </div>

    </div>

    <script>
        let eleccionBase = "Chica";
        let eleccionPlanta = "";
        let pasoActual = 0;
        const numeroTelefono = "1234567890"; // Reemplaza con tu número de WhatsApp

        function empezar() {
            pasoActual = 1;
            document.getElementById('pantalla-bienvenida').style.display = 'none';
            document.getElementById('configurador').style.display = 'block';
            document.getElementById('paso-1').style.display = 'block';
            document.getElementById('paso-2').style.display = 'none';
        }

        function irAlPaso2() {
            pasoActual = 2;
            document.getElementById('paso-1').style.display = 'none';
            document.getElementById('paso-2').style.display = 'block';
            document.getElementById('preview-planta').style.display = 'inline-block';
        }

        function volverAtras() {
            if (pasoActual === 2) {
                pasoActual = 1;
                document.getElementById('paso-2').style.display = 'none';
                document.getElementById('paso-1').style.display = 'block';
            } else {
                pasoActual = 0;
                document.getElementById('configurador').style.display = 'none';
                document.getElementById('pantalla-bienvenida').style.display = 'block';
            }
        }

        function seleccionarBase(tamano, nombreImagen, elemento) {
            eleccionBase = tamano;
            
            document.getElementById('preview-base').innerText = 'Base: ' + tamano;
            const imgElement = document.getElementById('preview-img');
            imgElement.src = nombreImagen;
            
            let botones = document.querySelectorAll('#paso-1 .btn-opcion');
            botones.forEach(b => b.classList.remove('activo'));
            elemento.classList.add('activo');
        }

        function seleccionarPlanta(planta, elemento) {
            eleccionPlanta = planta;
            
            document.getElementById('preview-planta').innerText = 'Planta: ' + planta;
            
            let botones = document.querySelectorAll('#paso-2 .btn-opcion');
            botones.forEach(b => b.classList.remove('activo'));
            elemento.classList.add('activo');

            document.getElementById('btn-ws').style.display = 'block';
        }

        function enviarWhatsApp() {
            const mensaje = `¡Hola! Estuve personalizando mi Kokedama en la página web:%0A%0A🌿 *Tamaño de Base:* ${eleccionBase}%0A🌱 *Planta:* ${eleccionPlanta}%0A%0AMe gustaría consultar sobre el precio y coordinar la compra.`;
            const url = `https://wa.me/${numeroTelefono}?text=${mensaje}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
